name: aqsat
description: تطبيق إدارة البيع بالأقساط
publish_to: "none"
version: 1.3.0+5

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  pdf: ^3.11.0
  printing: ^5.13.1
  file_picker: ^13.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FDFEFE"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
