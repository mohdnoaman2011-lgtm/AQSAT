name: aqsat
description: تطبيق إدارة البيع بالأقساط
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^13.0.0
  file_picker: ^13.3.0
  intl: ^0.20.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B3D38"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
